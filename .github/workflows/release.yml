name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Tag must match package.json and sit on main
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag $GITHUB_REF_NAME is not on main. Merge first, then tag."; exit 1; }
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - name: Release notes from CHANGELOG.md
        run: npx tsx scripts/release-notes.ts "$GITHUB_REF_NAME" > release-notes.md
      - name: Package the plugin source
        run: git archive --format=tar.gz --prefix=bb-jira-boards-${GITHUB_REF_NAME}/ -o bb-jira-boards-${GITHUB_REF_NAME}.tar.gz HEAD
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "bb-jira-boards-${GITHUB_REF_NAME}.tar.gz" \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md --generate-notes $flags
      - name: Check the marketplace range
        # The marketplace entry tracks tags by semver range; a release outside it
        # needs a pull request to get-bb/marketplace. This only reports, never fails.
        run: |
          version="${GITHUB_REF_NAME#v}"
          range="$(curl -fsS https://raw.githubusercontent.com/get-bb/marketplace/main/entries/jira-boards.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).source.git.range))')" || { echo "Could not read the marketplace entry." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          if npx --yes semver -r "$range" "$version" > /dev/null; then
            echo "Marketplace range \`$range\` includes $version: users can update with \`bb plugin update jira-boards --yes\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::$version is outside the marketplace range $range. Open a PR to get-bb/marketplace changing entries/jira-boards.json."
            echo "**Marketplace PR needed:** $version is outside \`$range\`. Update \`source.git.range\` in \`entries/jira-boards.json\`." >> "$GITHUB_STEP_SUMMARY"
          fi
